services:
  - type: web
    name: aqary-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node -e "require('child_process').execSync('npx -y ts-node db/apply-schema.ts',{stdio:'inherit'})" && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_ORIGIN
        value: "*"
